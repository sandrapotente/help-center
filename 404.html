<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found — R-Link Help</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#001233;color:#fff;font-family:'Open Sans',system-ui,sans-serif;text-align:center;padding:32px}
  .wrap{max-width:520px}
  .code{font-family:'Raleway',sans-serif;font-weight:800;font-size:96px;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#6a1fbf,#00c853);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
  h1{font-family:'Raleway',sans-serif;font-weight:800;font-size:28px;margin:0 0 12px}
  p{color:rgba(255,255,255,.7);font-size:15px;line-height:1.6;margin:0 0 24px}
  a{display:inline-block;padding:12px 22px;background:#6a1fbf;color:#fff;text-decoration:none;border-radius:10px;font-weight:700;font-family:'Raleway',sans-serif;font-size:14px;letter-spacing:.01em}
  a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This article doesn't exist.</h1>
    <p>The page you're looking for may have been moved or removed. Head back to the Help Center to find what you need.</p>
    <a href="/">← Back to Help Center</a>
  </div>
</body>
</html>
